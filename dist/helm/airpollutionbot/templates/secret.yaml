{{- if not .Values.telegramBot.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telegram-bot.fullname" . }}
  labels:
    {{- include "telegram-bot.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.telegramBot.token | b64enc }}
  owmToken: {{ .Values.telegramBot.owmToken | b64enc }}
{{- end }}